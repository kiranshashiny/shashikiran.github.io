<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stock Tracker Dashboard</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #0d1117;
            color: #c9d1d9;
            padding: 2rem;
            margin: 0;
        }
        h1 {
            text-align: center;
            color: #58a6ff;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 1.5rem;
            margin-top: 2rem;
        }
        .card {
            background-color: #161b22;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 1.5rem;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        }
        .card h2 {
            margin: 0 0 0.5rem 0;
            font-size: 1.5rem;
            color: #f0f6fc;
        }
        .price {
            font-size: 2rem;
            font-weight: bold;
            margin: 0.5rem 0;
        }
        .change {
            font-size: 1rem;
            font-weight: 600;
        }
        .up { color: #3fb950; }
        .down { color: #f85149; }
        .details {
            font-size: 0.85rem;
            color: #8b949e;
            margin-top: 1rem;
            border-top: 1px solid #21262d;
            padding-top: 0.5rem;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>📈 Real-Time Stock Tracker</h1>
        <div id="stock-grid" class="grid">Loading stocks...</div>
    </div>

    <script>
        // 1. REPLACE WITH YOUR FINNHUB API KEY
        const API_KEY = 'cm19srpr01qk0g5fn2kgcm19srpr01qk0g5fn2l0';

        // 2. Add or remove stock tickers here
        const STOCKS = ['AMD', 'MSFT', 'AAPL', 'NVDA', 'GOOGL'];

        async function fetchStockData(ticker) {
            try {
                const response = await fetch(`https://finnhub.io/api/v1/quote?symbol=${ticker}&token=${API_KEY}`);
                if (!response.ok) throw new Error('API Request Failed');
                const data = await response.json();
                return data;
            } catch (error) {
                console.error(`Error fetching ${ticker}:`, error);
                return null;
            }
        }

        async function renderDashboard() {
            const grid = document.getElementById('stock-grid');
            grid.innerHTML = ''; // Clear loading text

            for (const symbol of STOCKS) {
                const data = await fetchStockData(symbol);

                if (!data || data.c === 0) {
                    grid.innerHTML += `
                        <div class="card">
                            <h2>${symbol}</h2>
                            <p style="color: #f85149;">Failed to load data. Check API Key.</p>
                        </div>`;
                    continue;
                }

                const currentPrice = data.c.toFixed(2);
                const change = data.d.toFixed(2);
                const percentChange = data.dp.toFixed(2);
                const isPositive = data.d >= 0;
                const changeClass = isPositive ? 'up' : 'down';
                const sign = isPositive ? '+' : '';

                const cardHTML = `
                    <div class="card">
                        <h2>${symbol}</h2>
                        <div class="price">$${currentPrice}</div>
                        <div class="change ${changeClass}">
                            ${sign}${change} (${sign}${percentChange}%)
                        </div>
                        <div class="details">
                            High: $${data.h.toFixed(2)} | Low: $${data.l.toFixed(2)}<br>
                            Previous Close: $${data.pc.toFixed(2)}
                        </div>
                    </div>
                `;
                grid.innerHTML += cardHTML;
            }
        }

        // Run on page load
        renderDashboard();
    </script>
</body>
</html>
